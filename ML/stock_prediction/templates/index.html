<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LSTM Price Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #eef2f3, #8e9eab);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
      color: #333;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }

    input[type="file"] {
      margin: 20px 0;
      font-size: 14px;
    }

    input[type="submit"] {
      background-color: #007BFF;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 30px;
      font-size: 18px;
      padding: 15px;
      border-radius: 8px;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 LSTM Price Predictor</h1>
    <p>Upload a CSV file with <strong>1 column</strong> of numeric data (minimum 100 rows).</p>

    <form method="POST" action="/" enctype="multipart/form-data">
      <input type="file" name="file" accept=".csv" required><br>
      <input type="submit" value="Predict">
    </form>

    {% if prediction %}
      <div class="result {% if '❌' in prediction %}error{% else %}success{% endif %}">
        {{ prediction }}
      </div>
    {% endif %}
  </div>
</body>
</html>
