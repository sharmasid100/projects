<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎵 Speech Translator</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to right, #6dd5fa, #2980b9);
            color: #fff;
            text-align: center;
            padding: 50px;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        input[type="file"], select {
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin: 10px 0;
            width: 90%;
            background: #fff;
            color: #333;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #ff7675;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #e84393;
        }

        #result {
            margin-top: 30px;
            font-size: 18px;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: #ffeaa7;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎤🎶</div>
        <h2>Upload Your Audio & Translate Instantly!</h2>
        <form id="uploadForm">
            <input type="file" name="audio" accept="audio/*" required><br>

            <label for="language">Translate To:</label>
            <select name="language" id="language" required>
                <option value="hindi">Hindi</option>
                <option value="malayalam">Malayalam</option>
                <option value="tamil">Tamil</option>
                <option value="telugu">Telugu</option>
                <option value="kannada">Kannada</option>
                <option value="bengali">Bengali</option>
                <option value="gujarati">Gujarati</option>
                <option value="marathi">Marathi</option>
                <option value="punjabi">Punjabi</option>
            </select><br>

            <button type="submit">Translate</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            resultDiv.innerHTML = "🎧 Processing your audio...";

            try {
                const response = await fetch('/translate-audio', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.translated_text) {
                    resultDiv.innerHTML = `<h3>🗣️ Translated Text:</h3><p>${data.translated_text}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ Error: ${data.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color:red;">⚠️ Request failed: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
